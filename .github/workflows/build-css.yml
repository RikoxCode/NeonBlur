name: Build CSS Theme

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [20.x]
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci --legacy-peer-deps || npm install
    
    - name: Build CSS (expanded)
      run: npm run build
    
    - name: Build CSS (minified)
      run: npm run build:min
    
    - name: Upload CSS artifacts
      uses: actions/upload-artifact@v4
      with:
        name: jellyfin-theme-css
        path: |
          dist/*.css
          dist/*.css.map
        retention-days: 30
    
    - name: Create Release
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ github.run_number }}
        name: Release v${{ github.run_number }}
        body: |
          🎨 Automated CSS Build
          
          **Built from:** ${{ github.sha }}
          **Build Number:** #${{ github.run_number }}
          
          ## 📦 Files:
          - `neonblur-theme.css` - Expanded version
          - `neonblur-theme.min.css` - Minified version
          
          ## 🚀 jsDelivr CDN Links:
          ```
          https://cdn.jsdelivr.net/gh/${{ github.repository }}@v${{ github.run_number }}/dist/neonblur-theme.css
          https://cdn.jsdelivr.net/gh/${{ github.repository }}@v${{ github.run_number }}/dist/neonblur-theme.min.css
          ```
          
          ## 📋 Latest Version (always up-to-date):
          ```
          https://cdn.jsdelivr.net/gh/${{ github.repository }}@main/dist/neonblur-theme.css
          https://cdn.jsdelivr.net/gh/${{ github.repository }}@main/dist/neonblur-theme.min.css
          ```
        files: |
          dist/neonblur-theme.css
          dist/neonblur-theme.min.css
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
